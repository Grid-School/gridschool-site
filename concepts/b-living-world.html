<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Concept B · The Living World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
/* CONCEPT B - THE LIVING WORLD
   The GridSchool G occupies a cell in world space.
   Hierarchy: headline → G → supporting copy → action. */

:root {
  --void: #010306;
  --current: #28e1ff;
  --ink: #cfdcea;
  --ghost: #52667c;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--void);
  color: var(--ink);
  font-family: "IBM Plex Sans", system-ui, sans-serif;
  overflow: hidden;
}

#world {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

.mark {
  position: absolute;
  top: 34px;
  left: 40px;
  display: flex;
  align-items: center;
  gap: 12px;
  z-index: 3;
}
.mark svg { width: 26px; height: 26px; }
.mark .g-on rect { fill: var(--current); }
.mark .g-off rect { fill: #0c1724; }
.mark span {
  font-family: "IBM Plex Mono", monospace;
  font-size: 11px;
  letter-spacing: 0.42em;
  color: var(--ghost);
}
.mark span b { color: var(--ink); font-weight: 500; }

/* provenance, attached to the G */
.dock {
  position: absolute;
  left: 58%;
  top: 42%;
  z-index: 3;
  font-family: "IBM Plex Mono", monospace;
  font-size: 10px;
  letter-spacing: 0.12em;
  line-height: 1.75;
  color: var(--ghost);
  padding: 6px 12px 8px;
  max-width: calc(100vw - 80px);
  white-space: nowrap;
  background: radial-gradient(
    ellipse 70% 72% at 20% 30%,
    rgba(1, 3, 6, 0.88) 16%,
    rgba(1, 3, 6, 0.4) 58%,
    transparent 78%
  );
  text-shadow: 0 1px 8px rgba(1, 3, 6, 0.95);
  pointer-events: none;
  transform: translateZ(0);
}
.dock-state {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--current);
  letter-spacing: 0.12em;
}
.dock-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--current);
}
.dock-proof {
  margin-top: 10px;
}
.dock-proof div {
  display: grid;
    grid-template-columns: 5.4em auto;
  gap: 0 18px;
}
.dock-proof dt { color: var(--ghost); font-weight: 400; }
.dock-proof dd { margin: 0; color: var(--ink); }

/* proposition shares the artifact's vertical band */
.words {
  position: absolute;
  left: 40px;
  top: calc(30% + 50px);
  z-index: 3;
  max-width: 400px;
}
.words > * { position: relative; z-index: 1; }
.words::before {
  content: "";
  position: absolute;
  inset: -64px -120px -56px -64px;
  background: radial-gradient(
    ellipse 78% 74% at 24% 34%,
    rgba(1, 3, 6, 0.96) 0%,
    rgba(1, 3, 6, 0.78) 38%,
    rgba(1, 3, 6, 0.28) 64%,
    transparent 80%
  );
  z-index: 0;
  pointer-events: none;
}
h1 {
  font-weight: 300;
  font-size: clamp(26px, 3.1vw, 42px);
  line-height: 1.22;
  color: #fff;
  letter-spacing: 0.005em;
}
.lede {
  margin-top: 22px;
  font-size: 15px;
  font-weight: 300;
  color: #b8c6d4;
  line-height: 1.7;
  letter-spacing: 0.015em;
}
.offer {
  margin-top: 28px;
  font-family: "IBM Plex Mono", monospace;
  font-size: 9px;
  letter-spacing: 0.14em;
  color: #93aabf;
}
.enter {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin-top: 16px;
  padding: 8px 0 4px;
  font-family: "IBM Plex Mono", monospace;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.2em;
  color: var(--current);
  text-decoration: none;
  text-shadow: 0 0 20px rgba(40, 225, 255, 0.22);
  transition: color 0.16s ease, text-shadow 0.16s ease;
}
.enter-arrow {
  color: inherit;
  transition: transform 0.16s ease;
}
.enter:hover,
.enter:focus-visible {
  color: #6eebff;
  text-shadow: 0 0 24px rgba(40, 225, 255, 0.36);
  outline: none;
}
.enter:hover .enter-arrow,
.enter:focus-visible .enter-arrow {
  transform: translateX(4px);
}

@media (max-width: 720px) {
  .mark { left: 24px; top: 26px; }
  .words {
    left: 24px;
    right: 24px;
    top: auto;
    bottom: 36px;
    max-width: none;
  }
  .dock {
    left: 24px;
    top: 26%;
    bottom: auto;
  }
  h1 { font-size: 26px; }
}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<canvas id="world" aria-label="The GridSchool G rotating over a coordinate grid."></canvas>

<header class="mark">
  <svg viewBox="0 0 36 36" aria-hidden="true">
    <g transform="translate(18 18) rotate(45) translate(-12.5 -12.5)">
      <g class="g-off">
        <rect x="5.4" y="5.4" width="4.2" height="4.2" rx="1.2"/><rect x="10.4" y="5.4" width="4.2" height="4.2" rx="1.2"/><rect x="15.4" y="5.4" width="4.2" height="4.2" rx="1.2"/><rect x="20.4" y="5.4" width="4.2" height="4.2" rx="1.2"/><rect x="5.4" y="10.4" width="4.2" height="4.2" rx="1.2"/><rect x="10.4" y="10.4" width="4.2" height="4.2" rx="1.2"/><rect x="5.4" y="15.4" width="4.2" height="4.2" rx="1.2"/><rect x="10.4" y="15.4" width="4.2" height="4.2" rx="1.2"/><rect x="15.4" y="15.4" width="4.2" height="4.2" rx="1.2"/>
      </g>
      <g class="g-on">
        <rect x="0.4" y="0.4" width="4.2" height="4.2" rx="1.2"/><rect x="5.4" y="0.4" width="4.2" height="4.2" rx="1.2"/><rect x="10.4" y="0.4" width="4.2" height="4.2" rx="1.2"/><rect x="15.4" y="0.4" width="4.2" height="4.2" rx="1.2"/><rect x="20.4" y="0.4" width="4.2" height="4.2" rx="1.2"/><rect x="0.4" y="5.4" width="4.2" height="4.2" rx="1.2"/><rect x="0.4" y="10.4" width="4.2" height="4.2" rx="1.2"/><rect x="15.4" y="10.4" width="4.2" height="4.2" rx="1.2"/><rect x="20.4" y="10.4" width="4.2" height="4.2" rx="1.2"/><rect x="0.4" y="15.4" width="4.2" height="4.2" rx="1.2"/><rect x="20.4" y="15.4" width="4.2" height="4.2" rx="1.2"/><rect x="0.4" y="20.4" width="4.2" height="4.2" rx="1.2"/><rect x="5.4" y="20.4" width="4.2" height="4.2" rx="1.2"/><rect x="10.4" y="20.4" width="4.2" height="4.2" rx="1.2"/><rect x="15.4" y="20.4" width="4.2" height="4.2" rx="1.2"/><rect x="20.4" y="20.4" width="4.2" height="4.2" rx="1.2"/>
      </g>
    </g>
  </svg>
  <span>GRID<b>SCHOOL</b></span>
</header>

<aside class="dock" id="dock">
  <div class="dock-state">
    <i class="dock-dot"></i>
    IN THE WORLD
  </div>
  <dl class="dock-proof">
    <div><dt>PR</dt><dd>MERGED</dd></div>
    <div><dt>TESTS</dt><dd>PASS</dd></div>
    <div><dt>REVIEW</dt><dd>ACCEPTED</dd></div>
    <div><dt>WORLD</dt><dd>LIVE</dd></div>
  </dl>
</aside>

<div class="words">
  <h1>Your code will stand<br>somewhere real.</h1>
  <p class="lede">Ship into a running multiplayer world. Every change is reviewed, deployed, and real, or it does not count.</p>
  <p class="offer">FOUNDING DEFENSE LAB · 5 SPOTS · 8 WEEKS</p>
  <a class="enter" href="#">APPLY FOR A SPOT<span class="enter-arrow" aria-hidden="true">→</span></a>
</div>

<script type="module">
import { createWorld } from "./js/world-scene.js?v=fix9";

createWorld({
  canvas: document.getElementById("world"),
  dock: {
    root: document.getElementById("dock"),
  },
});
</script>

</body>
</html>
