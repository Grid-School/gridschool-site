<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<title>Your board. GridSchool</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="The GridSchool platform: your path, your queue, your calendar, your reviews.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../landing.css">
<link rel="stylesheet" href="app.css">
<style>
  .boot { min-height: 100vh; display: grid; place-items: center; padding: 40px 24px; text-align: center; }
  .boot__inner { width: min(360px, 100%); }
  .boot__kicker { margin: 0 0 10px; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: #7d8ea3; }
  .boot__title { margin: 0; font-size: 22px; font-weight: 400; letter-spacing: 0; color: #fff; line-height: 1.3; }
  .boot__bar { display: block; height: 1px; margin: 22px auto 0; width: 72px; background: #5ee7ff; transform-origin: center; animation: boot-pulse 1.2s ease-in-out infinite; }
  .boot__fail { margin: 18px 0 0; font-size: 14px; line-height: 1.55; color: #b8c6d4; }
  .boot__fail a { color: #5ee7ff; }
  @keyframes boot-pulse { 50% { opacity: .25; transform: scaleX(.55); } }
</style>
</head>
<body>
<div class="gridbg" aria-hidden="true"></div>
<div id="app">
  <div class="boot" id="boot" role="status" aria-live="polite">
    <div class="boot__inner">
      <p class="boot__kicker">GridSchool</p>
      <p class="boot__title">Opening your board</p>
      <span class="boot__bar" aria-hidden="true"></span>
    </div>
  </div>
</div>
<noscript>
  <style>.boot__bar { display: none; }</style>
  <p class="boot__fail" style="position:fixed;inset:auto 24px 40px;text-align:center">This board runs in the browser. Enable JavaScript, and open it over http rather than as a file.</p>
</noscript>
<script>
  function showBootFailure(error) {
    var root = document.getElementById("boot");
    if (!root) return;
    var inner = root.querySelector(".boot__inner") || root;
    var bar = inner.querySelector(".boot__bar");
    if (bar) bar.remove();
    var fail = document.createElement("p");
    fail.className = "boot__fail";
    if (location.protocol === "file:") {
      fail.textContent = "Open this over http. From the site folder: python3 -m http.server 8000, then http://127.0.0.1:8000/app/?s=demo";
    } else {
      fail.textContent = error
        ? "The board did not open. " + (error.message || error)
        : "The board is taking too long. Refresh, or open this URL in Chrome or Safari instead of an in-editor preview.";
    }
    inner.appendChild(fail);
  }
  window.addEventListener("load", function () {
    window.setTimeout(function () {
      if (window.__gsReady) return;
      showBootFailure();
    }, 8000);
  });
</script>
<script type="module">
  try {
    await import("./js/boot.js");
  } catch (error) {
    console.error(error);
    showBootFailure(error);
  }
</script>
</body>
</html>
