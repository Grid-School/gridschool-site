<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="title desc">
  <title id="title">LinkedIn skim order</title>
  <desc id="desc">Attention order: Headline, then Featured proof, then the first lines of About.</desc>
  <rect width="720" height="320" fill="#05070c"/>
  <g font-family="IBM Plex Mono, ui-monospace, monospace" fill="#8b93a7">
    <text x="24" y="36" font-size="11" letter-spacing="0.12em" fill="#28e1ff">SKIM ORDER</text>
    <!-- Profile chrome -->
    <rect x="24" y="56" width="672" height="240" rx="8" fill="#0a0e16" stroke="#1e2636"/>
    <circle cx="72" cy="108" r="28" fill="#121826" stroke="#28e1ff" stroke-width="1.5"/>
    <text x="118" y="96" font-size="13" fill="#e8ecf4">Your name</text>
    <rect x="118" y="108" width="280" height="14" rx="3" fill="#121826" stroke="#28e1ff" stroke-width="1.5"/>
    <text x="126" y="119" font-size="10" fill="#28e1ff">1 · HEADLINE</text>
    <text x="410" y="119" font-size="10" fill="#5c6578">role · stack · proof</text>
    <!-- Featured -->
    <rect x="48" y="160" width="200" height="100" rx="6" fill="#121826" stroke="#28e1ff" stroke-width="1.5"/>
    <text x="60" y="182" font-size="10" fill="#28e1ff">2 · FEATURED</text>
    <text x="60" y="204" font-size="11" fill="#e8ecf4">One proof URL</text>
    <text x="60" y="224" font-size="10" fill="#5c6578">PR · site · demo</text>
    <!-- About -->
    <rect x="268" y="160" width="400" height="100" rx="6" fill="#121826" stroke="#3d4a63"/>
    <text x="280" y="182" font-size="10" fill="#28e1ff">3 · ABOUT (first lines)</text>
    <text x="280" y="204" font-size="11" fill="#e8ecf4">Who you are for · one receipt · ask</text>
    <text x="280" y="224" font-size="10" fill="#5c6578">Must work before Expand</text>
    <!-- arrows -->
    <path d="M400 122 L400 150" stroke="#28e1ff" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  </g>
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#28e1ff"/>
    </marker>
  </defs>
</svg>
