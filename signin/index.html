<style>
  .signin { max-width: 520px; margin: clamp(24px, 8svh, 96px) auto 64px; }
  .signin .card__title { font-size: clamp(26px, 3vw, 34px); overflow-wrap: anywhere; }
  .signin .card__fine a { color: var(--soft); text-underline-offset: 3px; }
  .signin .card__fine a:hover { color: var(--lumen); }
  .signin .card__fine + .card__fine { margin-top: 8px; }
  .signin__alt { margin-top: 22px !important; padding-top: 16px; border-top: 1px solid var(--line); }
  .steps-wait { display: flex; align-items: center; gap: 12px; margin-top: 14px; color: var(--soft); font-size: 14.5px; }
  @media (max-width: 480px) { .signin .save__row { grid-template-columns: 1fr; } .signin .save__row .btn { justify-content: center; text-align: center; } }
</style>
